<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Assistant Chat – PR Harvest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Inter',sans-serif;background:#eef4f6;color:#0e2430;display:flex;flex-direction:column;}

.topbar{
  background:#08222e;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);position:sticky;top:0;z-index:50;
}
.topbar a{color:#fff;text-decoration:none;font-size:20px;opacity:.8;}
.tb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid #4ac9e2;flex-shrink:0;}
.tb-avatar video{width:100%;height:100%;object-fit:cover;}
.tb-title{font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:700;}
.tb-sub{font-size:10.5px;color:#8fd8e8;display:flex;align-items:center;gap:4px;}
.tb-dot{width:6px;height:6px;border-radius:50%;background:#3ce27a;}

.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto;}

.msg-row{display:flex;gap:9px;align-items:flex-end;max-width:88%;}
.msg-row.bot{align-self:flex-start;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}

.msg-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#fff;}
.msg-avatar video{width:100%;height:100%;object-fit:cover;}

.bubble{padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;}
.msg-row.bot .bubble{background:#fff;border-bottom-left-radius:4px;color:#0e2430;box-shadow:0 2px 8px rgba(8,34,46,0.06);}
.msg-row.user .bubble{background:#08222e;color:#fff;border-bottom-right-radius:4px;}

.typing{display:flex;gap:4px;padding:14px 16px;}
.typing span{width:6px;height:6px;background:#b9c6cb;border-radius:50%;animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

.file-chip{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border-radius:10px;
  padding:8px 10px;margin-top:6px;font-size:12px;
}
.msg-row.user .file-chip{background:rgba(255,255,255,0.15);}
.file-chip img{width:32px;height:32px;border-radius:6px;object-fit:cover;}
.file-icon{width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:15px;}

.error-bubble{background:#fdeceb !important;color:#c0392b !important;}

.quick-replies{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;margin-left:41px;max-width:88%;}
.qr-btn{
  background:#fff;border:1.5px solid #b9dee6;color:#1e6b7f;padding:8px 15px;border-radius:20px;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;
}
.qr-btn:hover{background:#eaf7fa;border-color:#4ac9e2;}

/* ── MEDICINE ROADMAP ── */
.roadmap-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(8,34,46,0.1);margin-left:41px;max-width:400px;}
.roadmap-card h4{font-family:'Manrope',sans-serif;font-size:14px;margin-bottom:4px;}
.roadmap-note{font-size:11px;color:#8fa3ab;margin-bottom:14px;line-height:1.5;}
.roadmap-line{position:relative;padding-left:22px;}
.roadmap-line::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#dbe6ea;}
.rm-item{position:relative;padding-bottom:16px;}
.rm-item:last-child{padding-bottom:0;}
.rm-dot{position:absolute;left:-22px;top:2px;width:14px;height:14px;border-radius:50%;background:#4ac9e2;border:3px solid #fff;box-shadow:0 0 0 2px #4ac9e2;}
.rm-time{font-size:11px;font-weight:800;color:#1e6b7f;text-transform:uppercase;letter-spacing:.4px;}
.rm-med{font-size:13.5px;font-weight:700;color:#0e2430;margin-top:2px;}
.roadmap-form{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.roadmap-form input{flex:1;min-width:110px;padding:8px 10px;border:1.5px solid #dbe6ea;border-radius:8px;font-size:12.5px;font-family:'Inter',sans-serif;}
.roadmap-form button{background:#08222e;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
.roadmap-toggle{
  margin-left:41px;background:#eaf7fa;border:1.5px dashed #b9dee6;color:#1e6b7f;padding:10px 14px;
  border-radius:12px;font-size:12.5px;font-weight:600;cursor:pointer;max-width:340px;text-align:center;
}

.input-bar{
  background:#fff;border-top:1px solid #e6edf0;padding:10px 16px;
  display:flex;align-items:center;gap:8px;max-width:640px;width:100%;margin:0 auto;
  position:sticky;bottom:0;
}
.attach-btn{
  width:38px;height:38px;border-radius:50%;border:1.5px solid #dbe6ea;background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;
  color:#5c7580;transition:all .15s;
}
.attach-btn:hover{border-color:#4ac9e2;color:#1e6b7f;}
.attach-btn.listening{background:#e23c3c;border-color:#e23c3c;color:#fff;animation:micPulse 1.2s infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,60,60,0.5);}50%{box-shadow:0 0 0 8px rgba(226,60,60,0);}}
.speaking-indicator{
  display:none;align-items:center;gap:6px;font-size:11px;color:#4ac9e2;font-weight:600;
  margin-left:41px;margin-top:-8px;margin-bottom:4px;
}
.speaking-indicator.show{display:flex;}
.speaking-bars{display:flex;gap:2px;align-items:center;}
.speaking-bars span{width:2.5px;background:#4ac9e2;border-radius:2px;animation:soundBar 0.8s infinite ease-in-out;}
.speaking-bars span:nth-child(1){height:6px;animation-delay:0s;}
.speaking-bars span:nth-child(2){height:11px;animation-delay:.15s;}
.speaking-bars span:nth-child(3){height:8px;animation-delay:.3s;}
.speaking-bars span:nth-child(4){height:12px;animation-delay:.45s;}
@keyframes soundBar{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}
#msgInput{
  flex:1;border:1.5px solid #dbe6ea;border-radius:22px;padding:11px 16px;font-size:13.5px;
  font-family:'Inter',sans-serif;outline:none;
}
#msgInput:focus{border-color:#4ac9e2;}
.send-btn{
  width:40px;height:40px;border-radius:50%;background:#4ac9e2;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#08222e;flex-shrink:0;
  transition:transform .1s;
}
.send-btn:hover{transform:scale(1.05);}
.send-btn:disabled{background:#dfe6e9;cursor:not-allowed;}
#fileInput{display:none;}

.pending-files{display:flex;gap:6px;padding:0 16px 8px;max-width:640px;width:100%;margin:0 auto;flex-wrap:wrap;}
.pending-chip{
  background:#eaf7fa;border:1px solid #b9dee6;border-radius:8px;padding:5px 10px;font-size:11.5px;
  color:#1e6b7f;display:flex;align-items:center;gap:6px;
}
.pending-chip .rm{cursor:pointer;color:#e23c3c;font-weight:800;}

.disclaimer-bar{background:#fff4e0;color:#8a5a00;font-size:10.5px;text-align:center;padding:6px 12px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="/">←</a>
  <div class="tb-avatar">
    <video autoplay muted loop playsinline>
      <source src="https://cdnl.iconscout.com/lottie/premium/preview-watermark/smart-bot-explaining-data-animation-gif-download-13995638.mp4" type="video/mp4">
    </video>
  </div>
  <div>
    <div class="tb-title">Health Assistant</div>
    <div class="tb-sub"><span class="tb-dot"></span> Online · Preliminary guidance only</div>
  </div>
</div>
<div class="disclaimer-bar">⚠ Not a medical diagnosis. This assistant never prescribes medicine. For emergencies, use the Emergency button on the home page.</div>
<div class="speaking-indicator" id="speakingIndicator">
  <div class="speaking-bars"><span></span><span></span><span></span><span></span></div>
  Speaking…
</div>

<div class="chat-area" id="chatArea"></div>

<div class="roadmap-toggle" id="roadmapToggle" onclick="openMedicineForm()">💊 Already have a prescription? Tap to build your medicine reminder roadmap</div>

<div class="pending-files" id="pendingFiles"></div>

<div class="input-bar">
  <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach photo, X-ray, or report">📎</button>
  <button class="attach-btn" id="micBtn" onclick="toggleVoiceInput()" title="Speak your symptoms">🎤</button>
  <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx">
  <input type="text" id="msgInput" placeholder="Describe how you're feeling…" onkeydown="if(event.key==='Enter') sendMessage()">
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const BOT_AVATAR = 'https://cdnl.iconscout.com/lottie/premium/preview-watermark/smart-bot-explaining-data-animation-gif-download-13995638.mp4';
const USER_AVATAR = 'https://cdnl.iconscout.com/lottie/premium/preview-watermark/boy-animation-gif-download-7358546.mp4';

const chatArea = document.getElementById('chatArea');
const pendingFilesBox = document.getElementById('pendingFiles');
let pendingFiles = [];
let history = []; // [{role:'user'|'assistant', content:'...'}] — text-only history sent back to API

/* ── Rendering ── */
function avatarHTML(src){
  return `<div class="msg-avatar"><video autoplay muted loop playsinline><source src="${src}" type="video/mp4"></video></div>`;
}

function addMessage(sender, html, extraClass=''){
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const avatar = avatarHTML(sender === 'bot' ? BOT_AVATAR : USER_AVATAR);
  row.innerHTML = `${avatar}<div class="bubble ${extraClass}">${html}</div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
  return row;
}

function addQuickReplies(options){
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = ()=>{
      wrap.remove();
      document.getElementById('msgInput').value = opt;
      sendMessage();
    };
    wrap.appendChild(btn);
  });
  chatArea.appendChild(wrap);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `${avatarHTML(BOT_AVATAR)}<div class="bubble typing"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

/* ── File attach ── */
document.getElementById('fileInput').addEventListener('change', e=>{
  Array.from(e.target.files).forEach(f=> pendingFiles.push(f));
  renderPendingFiles();
});
function renderPendingFiles(){
  pendingFilesBox.innerHTML = pendingFiles.map((f,i)=>`
    <div class="pending-chip">📄 ${f.name.length>20 ? f.name.slice(0,17)+'…' : f.name} <span class="rm" onclick="removePending(${i})">✕</span></div>
  `).join('');
}
function removePending(i){ pendingFiles.splice(i,1); renderPendingFiles(); }

/* ── Send message to real backend ── */
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text && pendingFiles.length===0) return;

  let filesHtml = '';
  const filesToSend = [...pendingFiles];
  if(filesToSend.length){
    filesHtml = filesToSend.map(f=>{
      if(f.type.startsWith('image/')){
        return `<div class="file-chip"><img src="${URL.createObjectURL(f)}"> ${f.name.slice(0,14)}</div>`;
      }
      return `<div class="file-chip"><div class="file-icon">📄</div> ${f.name.slice(0,18)}</div>`;
    }).join('');
  }
  addMessage('user', (text ? escapeHtml(text) : 'Attached file(s):') + filesHtml);

  pendingFiles = [];
  renderPendingFiles();
  input.value = '';

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  showTyping();

  try{
    const formData = new FormData();
    formData.append('message', text);
    formData.append('history', JSON.stringify(history));
    filesToSend.forEach(f => formData.append('files', f));

    const res = await fetch('/api/chat', { method: 'POST', body: formData });
    const data = await res.json();

    hideTyping();

    if(data.error){
      addMessage('bot', '⚠ ' + data.error, 'error-bubble');
    } else {
      addMessage('bot', formatBotReply(data.reply));
      speakReply(data.reply);
      history.push({role: 'user', content: text || '[shared a file]'});
      history.push({role: 'assistant', content: data.reply});
      // Keep history from growing unbounded
      if(history.length > 20) history = history.slice(-20);

      if(data.options && data.options.length){
        addQuickReplies(data.options);
      }
      if(data.meds && data.meds.length){
        addExtractedMedsCard(data.meds);
      }
    }
  }catch(e){
    hideTyping();
    addMessage('bot', "⚠ I'm having trouble connecting right now. Please try again in a moment.", 'error-bubble');
  }finally{
    btn.disabled = false;
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function formatBotReply(text){
  return escapeHtml(text).replace(/\n/g, '<br>');
}

/* ── Medicine Roadmap (user-entered only — never AI-suggested) ── */
let medicineList = [];

function openMedicineForm(){
  document.getElementById('roadmapToggle').style.display = 'none';
  const card = document.createElement('div');
  card.className = 'roadmap-card';
  card.id = 'roadmapCard';
  card.innerHTML = `
    <h4>💊 Your Medicine Roadmap</h4>
    <div class="roadmap-note">Only add medicines your doctor has already prescribed. This organizes your schedule — it does not suggest what to take.</div>
    <div class="roadmap-line" id="roadmapLine"></div>
    <div class="roadmap-form">
      <input type="text" id="medName" placeholder="Medicine name">
      <input type="text" id="medTime" placeholder="e.g. Morning & Night">
      <button onclick="addMedicine()">+ Add</button>
    </div>
  `;
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addMedicine(){
  const name = document.getElementById('medName').value.trim();
  const time = document.getElementById('medTime').value.trim();
  if(!name || !time) return;
  medicineList.push({name, time});
  document.getElementById('medName').value = '';
  document.getElementById('medTime').value = '';
  renderRoadmap();
}

function renderRoadmap(){
  document.getElementById('roadmapLine').innerHTML = medicineList.map(m=>`
    <div class="rm-item">
      <div class="rm-dot"></div>
      <div class="rm-time">${escapeHtml(m.time)}</div>
      <div class="rm-med">${escapeHtml(m.name)}</div>
    </div>
  `).join('');
}

/* ── Extracted meds from an uploaded prescription photo ──
   These come straight from the AI reading the doctor's own handwriting/print —
   nothing here is AI-suggested, only transcribed. User confirms before adding. */
function addExtractedMedsCard(meds){
  const card = document.createElement('div');
  card.className = 'roadmap-card';
  card.innerHTML = `
    <h4>📋 Found on Your Prescription</h4>
    <div class="roadmap-note">Read directly from your uploaded photo — exactly as your doctor wrote it. Confirm below to add these to your reminder roadmap.</div>
    <div class="roadmap-line">
      ${meds.map((m,i) => `
        <div class="rm-item">
          <div class="rm-dot"></div>
          <div class="rm-time">${escapeHtml(m.instruction)}</div>
          <div class="rm-med">${escapeHtml(m.name)}</div>
        </div>
      `).join('')}
    </div>
    <button class="modal-submit" style="width:100%;background:#4ac9e2;color:#08222e;border:none;padding:11px;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;margin-top:10px;" onclick="confirmAddExtractedMeds(this, ${JSON.stringify(meds).replace(/"/g, '&quot;')})">
      ✓ Add All to My Roadmap
    </button>
    <div style="font-size:10.5px;color:#8fa3ab;margin-top:10px;line-height:1.5;">
      💰 <b>Tip:</b> Ask your pharmacist if a generic version of these medicines is available — generics at government Jan Aushadhi stores are often 50–90% cheaper. <a href="/scheme-checker" style="color:#1e6b7f;font-weight:700;">Learn more →</a>
    </div>
  `;
  chatArea.appendChild(card);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function confirmAddExtractedMeds(btn, meds){
  meds.forEach(m => medicineList.push({name: m.name, time: m.instruction}));
  btn.textContent = '✓ Added to Roadmap';
  btn.disabled = true;
  btn.style.opacity = '0.6';

  // If the roadmap card isn't open yet, open it now so the user can see the result
  if(!document.getElementById('roadmapCard')){
    document.getElementById('roadmapToggle').style.display = 'none';
    const card = document.createElement('div');
    card.className = 'roadmap-card';
    card.id = 'roadmapCard';
    card.innerHTML = `
      <h4>💊 Your Medicine Roadmap</h4>
      <div class="roadmap-note">Only medicines your doctor has already prescribed. This organizes your schedule — it does not suggest what to take.</div>
      <div class="roadmap-line" id="roadmapLine"></div>
      <div class="roadmap-form">
        <input type="text" id="medName" placeholder="Medicine name">
        <input type="text" id="medTime" placeholder="e.g. Morning & Night">
        <button onclick="addMedicine()">+ Add</button>
      </div>
    `;
    chatArea.appendChild(card);
  }
  renderRoadmap();
  chatArea.scrollTop = chatArea.scrollHeight;
}

/* ── Init ── */
/* ══════════════════════════════════════════
   VOICE INPUT (Speech-to-Text) — free, built into the browser
══════════════════════════════════════════ */
let recognition = null;
let isListening = false;

function initSpeechRecognition(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('micBtn').style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-IN'; // switches automatically below based on selected UI language if available

  recognition.onresult = (event) => {
    let transcript = '';
    for(let i = 0; i < event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('msgInput').value = transcript;
  };

  recognition.onend = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
    const val = document.getElementById('msgInput').value.trim();
    if(val) sendMessage();
  };

  recognition.onerror = () => {
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
  };
}

function toggleVoiceInput(){
  if(!recognition){ initSpeechRecognition(); }
  if(!recognition) return;

  if(isListening){
    recognition.stop();
    isListening = false;
    document.getElementById('micBtn').classList.remove('listening');
  } else {
    // Cancel any ongoing speech before listening
    window.speechSynthesis.cancel();
    document.getElementById('msgInput').value = '';
    recognition.start();
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
  }
}

/* ══════════════════════════════════════════
   VOICE OUTPUT (Text-to-Speech) — reads bot replies aloud
══════════════════════════════════════════ */
function speakReply(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();

  // Strip the [OPTIONS: ...] artifacts if any slipped through, keep plain text only
  const clean = text.replace(/\n/g, '. ');
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  utterance.lang = 'en-IN';

  const indicator = document.getElementById('speakingIndicator');
  utterance.onstart = () => { if(indicator) indicator.classList.add('show'); };
  utterance.onend = () => { if(indicator) indicator.classList.remove('show'); };
  utterance.onerror = () => { if(indicator) indicator.classList.remove('show'); };

  window.speechSynthesis.speak(utterance);
}

initSpeechRecognition();

addMessage('bot', "Hi! I'm your Health Assistant. 👋 Tell me what's going on, and I'll ask a few questions to understand your situation. You can also attach a photo of a report, X-ray, or prescription anytime using 📎, or tap 🎤 to speak instead of typing.");
</script>

</body>
</html>
